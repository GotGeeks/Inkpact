<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- surface-panel of each theme; contrast.test.ts keeps them equal to the token. theme.ts moves them for a chosen theme. -->
    <meta
      name="theme-color"
      data-scheme="light"
      content="#f7f7fa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      data-scheme="dark"
      content="#11131a"
      media="(prefers-color-scheme: dark)"
    />
    <title>Inkpact</title>
  </head>
  <body class="bg-surface-canvas text-on-surface">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
