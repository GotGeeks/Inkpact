packages:
  - web
  - server/sidecar

# Do not install versions published less than a day ago.
minimumReleaseAge: 1440

# Install scripts stay blocked. Add a package here only after asking.
onlyBuiltDependencies: []

# Advisories `pnpm audit` must not fail for. One per entry, and a comment above it says why it is safe and when to drop
# it. Only for an advisory without a fixed version that cannot reach what ships: anything else gets fixed.
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS through repeated extglobs, every version up to 4.0.7 (the newest), no release fixes it yet
    # (micromatch/picomatch#194). It runs only at build and test time (Vite, tinyglobby, vue-router's file-routing
    # plugin, which the app does not use), on patterns from our own config; it is not in the web bundle, the sidecar's
    # production dependencies or the server. Drop this entry when a picomatch above 4.0.7 is out.
    - GHSA-fc5q-39xc-vjpf

# Versions with a fixed advisory, for dependencies whose own range still allows the vulnerable ones. Only the vulnerable
# range is moved; drop an entry when `pnpm why` shows nothing needs it any more.
overrides:
  # GHSA-3g3m-2fjr-6pw4: js-beautify (through @vue/test-utils) and @intlify/eslint-plugin-vue-i18n.
  'glob@>=9.0.0 <14.0.2': ^14.0.2
  # GHSA-g3hv-75wg-m249: editorconfig (through js-beautify), and glob before the override above.
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
