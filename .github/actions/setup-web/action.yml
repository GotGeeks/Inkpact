name: Set up the web workspace
description: pnpm, Node with the pnpm store cached, and the workspace dependencies from the lockfile.

runs:
  using: composite
  steps:
    # Exact tag: the floating v6 tag still points at 6.0.10, which predates pnpm 12 support.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        # The version comes from the packageManager field in the root package.json.
        package_json_file: package.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
