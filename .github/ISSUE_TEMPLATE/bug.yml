name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: For example Firefox 150 on Windows 11, or Chrome on Android 16.
  - type: checkboxes
    id: data
    attributes:
      label: Data
      options:
        - label: This bug lost or corrupted data
