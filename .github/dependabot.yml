version: 2

updates:
  # global.json pins the .NET SDK exactly (see the note in CONTRIBUTING.md), so someone has to move it when a
  # patch comes out. This does it: a pull request every week there is a newer SDK, and CI then proves the build
  # works with it before it is merged. The rest of the dependencies (NuGet, pnpm, the GitHub Actions) get their
  # tooling in run 1.20.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # The base images in the Dockerfile are pinned by tag and digest; this moves them.
  - package-ecosystem: docker
    directory: /
    # Node stays on 24, the version in `engines`, CI and the sidecar. The images from 25 on no longer ship Corepack,
    # which the Dockerfile uses for pnpm. Patch and minor updates still come; a new major is a deliberate change.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
