name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The full suite on request, for a branch that needs it before merging.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request gets the quick checks: lint, types, unit tests, format and build, commit messages. The slow suites
  # (the server's Testcontainers tests and the Playwright run, which downloads browsers) run on the contributor's machine
  # before the push (`pnpm check:push`, and `pnpm check` once per pull request, see CONTRIBUTING) and again on main and on
  # request, so a break there is found at once.
  #
  # A Dependabot pull request runs the slow suites too: nobody runs `pnpm check` for it, nobody waits on it, and an update
  # that breaks the server or the editor (Markdig 1.5.1 did) is then stopped before it reaches main.
  #
  # Which jobs the change needs. A skipped job counts as passed for a required check, so a pull request that only touches
  # the web client does not wait for the server tests, and one that only touches documentation waits for neither.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.areas.outputs.server }}
      web: ${{ steps.areas.outputs.web }}
      e2e: ${{ steps.areas.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: areas
        run: bash .github/scripts/changed-areas.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  server:
    name: server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # Node and the workspace dependencies: the tests start the real Yjs sidecar (server/sidecar).
      - uses: ./.github/actions/setup-web
      - name: Format
        run: dotnet format server --verify-no-changes
      - name: Build
        run: dotnet build server --configuration Release
      - name: Test
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]'
        run: dotnet test server --configuration Release --no-build

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - name: Lint (ESLint and Prettier)
        run: pnpm --filter web lint
      - name: Typecheck
        run: pnpm --filter web typecheck
      - name: Test
        run: pnpm --filter web test
      - name: Yjs sidecar, Prettier
        run: pnpm --filter sidecar lint
      - name: Yjs sidecar, typecheck
        run: pnpm --filter sidecar typecheck
      - name: Yjs sidecar, tests
        run: pnpm --filter sidecar test

  e2e:
    name: e2e
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]') &&
      needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own image: the browsers and every system library they need are in it, so nothing is downloaded from
    # an Ubuntu mirror (one that hung held the job for its whole install timeout). Its version must be the one of
    # @playwright/test in the lockfile; the first step checks that. Dependabot does not move this tag: when its
    # `playwright` group moves the package, that pull request fails here until the tag below is changed to match.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # As Playwright's Docker guide advises for Chromium: a shared memory the size of the host's, and an init process.
      options: --ipc=host --init
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # In a container job a service is reached by its name, not on localhost.
      E2E_DATABASE: Host=postgres;Port=5432;Database=inkpact_e2e;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-web

      - name: The image matches @playwright/test
        working-directory: web
        run: |
          set -euo pipefail
          package="$(node -p "require('@playwright/test/package.json').version")"
          image="$(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9.]+' ../.github/workflows/ci.yml | head -1 | sed 's/.*:v//')"
          if [ "$package" != "$image" ]; then
            echo "::error file=.github/workflows/ci.yml::@playwright/test is $package but the e2e image is v$image: change the image tag in ci.yml to v$package-noble"
            exit 1
          fi

      # Builds the bundle and the server, starts the server on :5090 and runs every project against it.
      - name: End-to-end tests
        run: pnpm --filter web e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-web
      # Dependabot writes its own commit messages (long release notes, its own sign-off), and GitHub sets the
      # author of its pull requests, which nobody else can fake. Everything else is checked.
      - name: Conventional commits
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: DCO sign-off
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: bash .github/scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
