name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Node and the workspace dependencies: the tests start the real Yjs sidecar (server/sidecar).
      - uses: ./.github/actions/setup-web
      - name: Format
        run: dotnet format server --verify-no-changes
      - name: Build
        run: dotnet build server --configuration Release
      - name: Test
        run: dotnet test server --configuration Release --no-build

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - name: Lint (ESLint and Prettier)
        run: pnpm --filter web lint
      - name: Typecheck
        run: pnpm --filter web typecheck
      - name: Test
        run: pnpm --filter web test
      - name: Yjs sidecar, Prettier
        run: pnpm --filter sidecar lint
      - name: Yjs sidecar, typecheck
        run: pnpm --filter sidecar typecheck
      - name: Yjs sidecar, tests
        run: pnpm --filter sidecar test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-web

      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Also installs the system libraries, which a cache hit does not restore.
      - name: Install the browsers
        run: pnpm --filter web e2e:install

      # Builds the bundle and the server, starts the server on :5090 and runs every project against it.
      - name: End-to-end tests
        run: pnpm --filter web e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-web
      # Dependabot writes its own commit messages (long release notes, its own sign-off), and GitHub sets the
      # author of its pull requests, which nobody else can fake. Everything else is checked.
      - name: Conventional commits
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: DCO sign-off
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: bash .github/scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
