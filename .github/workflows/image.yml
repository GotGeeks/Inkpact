name: Image

# The container image: built, checked and scanned for a change that can affect it, and published as `edge` to GHCR on
# every merge to main. A pull request builds and scans only. No Playwright here: it is too slow on GitHub, so the suite
# against the container is run locally (see CONTRIBUTING). Release tags, signing and attestations come with the release pipeline.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - .github/workflows/image.yml
      - .trivyignore
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LOCAL_IMAGE: inkpact:ci

jobs:
  check:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only: loaded into the runner's Docker to be inspected, scanned and started.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      # The properties the compose file and the sidecar rely on, checked on the image itself.
      - name: Inspect
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id "$LOCAL_IMAGE" -u)" != 0
          docker run --rm --entrypoint node "$LOCAL_IMAGE" --version | grep -E '^v24\.'
          docker run --rm --entrypoint pg_dump "$LOCAL_IMAGE" --version | grep -E ' 1[89]\.| [2-9][0-9]\.'
          docker run --rm --entrypoint test "$LOCAL_IMAGE" -d /app/sidecar/node_modules/yjs
          docker run --rm --entrypoint test "$LOCAL_IMAGE" -f /app/wwwroot/index.html
          # A read-only root filesystem refuses a write anywhere but the mounted /data and /tmp.
          ! docker run --rm --read-only --entrypoint touch "$LOCAL_IMAGE" /app/x

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

  publish:
    name: publish
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the repository name, which a registry requires.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
