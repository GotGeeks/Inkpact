name: Release

# Releases (run B.8). On every push to main, release-please keeps one pull request up to date: the next version, worked
# out from the conventional commits since the last release, and its changelog. Merging that pull request is the release:
# release-please tags it and makes the GitHub release, and this workflow then calls image.yml, which checks the image and
# publishes it as x.y.z, x.y and latest, signed, with its SBOM and provenance.
#
# The pull request is opened with a GitHub App's token, not GITHUB_TOKEN: a pull request opened with GITHUB_TOKEN runs no
# workflow, so its required checks would never report. Until the App's secrets are set this does nothing, and says so.
# Setting it up: CONTRIBUTING.md, "Releases".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One at a time, never cut short: a release half made would leave a tag without its images.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: app
        name: Is the release App set up?
        run: |
          if [[ -n "$CLIENT_ID" && -n "$KEY_SET" ]]; then
            echo "ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::No release App yet (RELEASE_APP_CLIENT_ID and RELEASE_APP_KEY): no release pull request is made."
          fi
        env:
          CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          KEY_SET: ${{ secrets.RELEASE_APP_KEY != '' }}

      - id: token
        if: steps.app.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write # the release pull request's labels

      - id: release
        if: steps.app.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    name: images
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
