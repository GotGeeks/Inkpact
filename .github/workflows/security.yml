name: Security

# Known vulnerabilities and licences in what Inkpact depends on. Runs on every pull request (no path filter: a required
# check that does not run blocks the merge, and the jobs take about a minute), on main, every day (advisories appear
# without any change here) and on request. The rules are explained in docs/architecture.md → CI/CD.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fails on a known vulnerability: high or worse anywhere and moderate or worse in what ships (npm), moderate or worse
  # in the shipped projects and high or worse in the test project (NuGet). The build reports NuGet advisories as warnings
  # (Directory.Build.props) so this job is the one place that decides.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-web

      - name: npm, everything installed (high or worse)
        run: pnpm audit --audit-level high
      - name: npm, what ships (moderate or worse)
        run: pnpm audit --prod --audit-level moderate

      - name: Restore
        run: dotnet restore server
      - name: NuGet
        run: node .github/scripts/nuget-audit.mjs

  # Every npm and NuGet package against .github/license-policy.json. Dev dependencies count: the tooling runs on
  # contributors' machines and in CI.
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-web

      # The scripts that decide the other checks are tested where they run.
      - name: Test the CI scripts
        run: node --test .github/scripts

      - name: Restore
        run: dotnet restore server
      - name: Licences
        run: node .github/scripts/check-licenses.mjs

  # A pull request that adds a dependency with a moderate or worse advisory. The licences are not checked here (the
  # policy file is the one place); the job summary lists each new dependency with its licence and OpenSSF score.
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          show-openssf-scorecard: true
          comment-summary-in-pr: never
